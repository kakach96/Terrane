[package]
name = "terrane"
version = "0.1.0"
edition = "2021"
authors = ["Terrane Team"]
description = "Terrane - Cloud-native, high-performance spatial data server, powered by Rust"

[dependencies]
actix-web = "4"
actix-rt = "2"
actix-files = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.24"
geo = "0.27"
geo-types = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
config = "0.13"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
quick-xml = { version = "0.31", features = ["serialize"] }
sysinfo = "0.30"
rusqlite = { version = "0.29", features = ["chrono", "bundled"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
deadpool-postgres = "0.10"
futures-util = "0.3"
postgres-native-tls = "0.5"

# Shapefile 解析 (纯 Rust)
shapefile = "0.5"

# 文件上传
actix-multipart = "0.8"
# GeoTIFF 原生标签读取
tiff = "0.9"
# ZIP 解压 (用于 shapefile 上传)
zip = "2"
# 临时文件
tempfile = "3"
# HTTP 客户端 (级联服务)
reqwest = { version = "0.11", features = ["json"] }
# CORS 中间件
actix-cors = "0.7"
# 密码哈希 & JWT (安全性)
sha2 = "0.10"
hex = "0.4"
jsonwebtoken = "9"
rand = "0.8"
serde_yaml = "0.9"
# 异步 trait (Store 抽象层)
async-trait = "0.1"
# zlib 压缩 (WMS PDF 输出内嵌 FlateDecode 图像)
flate2 = "1"
proj4rs = { version = "0.1.10", features = ["crs-definitions"] }
# S3 对象存储 (AWS S3 / MinIO 等 S3 兼容服务); http-credentials 启用
# Credentials::new 以便按数据源传入 access/secret key
rust-s3 = { version = "0.34", features = ["http-credentials"] }
# Redis 缓存后端 (会话缓存 + 瓦片缓存; 多副本共享)
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
mysql_async = "0.34"
mongodb = "2.8"

[dev-dependencies]
actix-rt = "2"
