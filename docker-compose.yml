# =============================================================================
# Rust GeoServer - Docker Compose orchestration
#
# Usage:
#   docker compose up -d                                   # SQLite standalone mode (default)
#   docker compose --profile postgres up -d                # geoserver + PostgreSQL
#   docker compose logs -f geoserver
#   docker compose down
#
# Production notes:
#   * GEOSERVER_JWT_SECRET must be injected via a .env file or an environment
#     variable; all replicas must share the same secret
#   * Data is persisted on the named volume geoserver-data (replace with PVC /
#     object storage on K8s)
# =============================================================================

services:
  geoserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: rust-geoserver:latest
    container_name: rust-geoserver
    ports:
      - "8080:8080"
    environment:
      GEOSERVER__SERVER__HOST: 0.0.0.0
      GEOSERVER__SERVER__PORT: 8080
      # All replicas must share the same JWT secret; inject a strong random
      # value via .env in production
      GEOSERVER__SECURITY__JWT_SECRET: ${GEOSERVER_JWT_SECRET:-rust-geoserver-dev-secret}
      # ---- Default: SQLite standalone mode (data lives on geoserver-data volume) ----
      GEOSERVER__METADATA__KIND: sqlite
      GEOSERVER__METADATA__SQLITE_PATH: /data/geoserver.sqlite
      # ---- Switch to PostgreSQL (metadata + business data reuse): ----
      #   uncomment the lines below, then run: docker compose --profile postgres up -d
      # GEOSERVER__METADATA__KIND: postgres
      # GEOSERVER__METADATA__POSTGRES__HOST: postgres
      # GEOSERVER__METADATA__POSTGRES__PORT: 5432
      # GEOSERVER__METADATA__POSTGRES__INSTANCE: geoserver
      # GEOSERVER__METADATA__POSTGRES__USER: geoserver
      # GEOSERVER__METADATA__POSTGRES__PASSWORD: ${POSTGRES_PASSWORD:-geoserver}
      # GEOSERVER__BUSINESS__KIND: metadata
    volumes:
      - geoserver-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Optional: PostgreSQL (PostGIS) - HA backend for metadata / business storage
  # Use: docker compose --profile postgres up -d
  postgres:
    image: postgis/postgis:16-3.4
    profiles: ["postgres"]
    container_name: rust-geoserver-postgres
    environment:
      POSTGRES_DB: geoserver
      POSTGRES_USER: geoserver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geoserver}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Mapped to 5433 to avoid clashing with a local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoserver -d geoserver"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  geoserver-data:
  postgres-data:
