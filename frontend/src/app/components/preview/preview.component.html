<div class="preview-page fade-in">
  <div class="page-header">
    <div>
      <h1>图层预览</h1>
      <p class="subtitle">交互式地图预览 — 支持切片图层和 WMS 图层</p>
    </div>
  </div>

  <div class="preview-controls">
    <div class="control-row">
      <mat-button-toggle-group [(ngModel)]="previewMode" (change)="refreshPreview()">
        <mat-button-toggle value="layer">按图层</mat-button-toggle>
        <mat-button-toggle value="group">按图层组</mat-button-toggle>
      </mat-button-toggle-group>

      <mat-form-field appearance="outline" *ngIf="previewMode === 'layer'">
        <mat-label>选择图层</mat-label>
        <mat-select [(ngModel)]="selectedLayer" (selectionChange)="refreshPreview()">
          <mat-option *ngFor="let l of layers" [value]="l.name">
            {{ l.title || l.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" *ngIf="previewMode === 'group'">
        <mat-label>选择图层组</mat-label>
        <mat-select [(ngModel)]="selectedGroup" (selectionChange)="refreshPreview()">
          <mat-option *ngFor="let g of groups" [value]="g.name">
            {{ g.title || g.name }} ({{ g.layers.length }} 图层)
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>格式</mat-label>
        <mat-select [(ngModel)]="previewOptions.format" (selectionChange)="refreshPreview()">
          <mat-option *ngFor="let f of formatOptions" [value]="f.value">
            {{ f.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>坐标系</mat-label>
        <mat-select [(ngModel)]="previewOptions.crs" (selectionChange)="refreshPreview()">
          <mat-option *ngFor="let crs of crsOptions" [value]="crs">{{ crs }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="control-row secondary">
      <mat-form-field appearance="outline" class="size-input">
        <mat-label>宽度</mat-label>
        <input matInput type="number" [(ngModel)]="previewOptions.width" (change)="refreshPreview()">
      </mat-form-field>

      <mat-form-field appearance="outline" class="size-input">
        <mat-label>高度</mat-label>
        <input matInput type="number" [(ngModel)]="previewOptions.height" (change)="refreshPreview()">
      </mat-form-field>

      <mat-checkbox [(ngModel)]="previewOptions.transparent" (change)="refreshPreview()" *ngIf="previewOptions.format !== 'application/openlayers'">
        透明背景
      </mat-checkbox>

      <button mat-raised-button color="primary" (click)="refreshPreview()">
        <mat-icon>refresh</mat-icon>
        刷新预览
      </button>
    </div>
  </div>

  <div class="map-container" *ngIf="mapUrl">
    <iframe *ngIf="previewOptions.format === 'application/openlayers'"
      [src]="mapUrl" class="map-frame" title="地图预览"></iframe>
    <img *ngIf="previewOptions.format !== 'application/openlayers'"
      [src]="mapUrl" alt="地图预览" class="map-image">
  </div>

  <div class="empty-state" *ngIf="!mapUrl">
    <mat-icon>map</mat-icon>
    <p>请选择一个图层或图层组开始预览</p>
  </div>
</div>
