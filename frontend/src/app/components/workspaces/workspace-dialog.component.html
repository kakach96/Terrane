<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'workspaces.nameLabel' | translate }}</mat-label>
      <input
        matInput
        formControlName="name"
        placeholder="{{ 'workspaces.namePlaceholder' | translate }}"
      />
      <mat-hint>{{ 'workspaces.nameHint' | translate }}</mat-hint>
      <mat-error *ngIf="name?.invalid">
        <span *ngIf="name.errors?.['required']">{{ 'workspaces.nameRequired' | translate }}</span>
        <span *ngIf="name.errors?.['pattern']">{{ 'workspaces.namePattern' | translate }}</span>
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'workspaces.titleLabel' | translate }}</mat-label>
      <input
        matInput
        formControlName="title"
        placeholder="{{ 'workspaces.titlePlaceholder' | translate }}"
      />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'workspaces.descLabel' | translate }}</mat-label>
      <textarea
        matInput
        formControlName="description"
        placeholder="{{ 'workspaces.descPlaceholder' | translate }}"
        rows="3"
      ></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="onCancel()">{{ 'workspaces.cancel' | translate }}</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="form.invalid">
    {{ isEdit ? ('workspaces.save' | translate) : ('workspaces.create' | translate) }}
  </button>
</mat-dialog-actions>
