<div class="login-header">
  <img src="assets/terrane.svg" alt="Terrane" class="logo-img" />
  <span class="logo-text">Terrane</span>
</div>

<div class="login-content">
  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'login.username' | translate }}</mat-label>
      <input
        matInput
        [(ngModel)]="username"
        name="username"
        required
        placeholder="admin"
        autocomplete="username"
      />
      <mat-icon matPrefix>person</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'login.password' | translate }}</mat-label>
      <input
        matInput
        [(ngModel)]="password"
        name="password"
        [type]="showPassword ? 'text' : 'password'"
        required
        autocomplete="current-password"
      />
      <mat-icon matPrefix>lock</mat-icon>
      <button mat-icon-button matSuffix (click)="showPassword = !showPassword" type="button">
        <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    <div class="error-message" *ngIf="errorMessage">
      <mat-icon>error</mat-icon> {{ errorMessage }}
    </div>

    <div class="login-actions">
      <button
        mat-raised-button
        color="primary"
        class="login-btn"
        type="submit"
        [disabled]="loading"
      >
        <mat-spinner diameter="20" *ngIf="loading" class="spinner"></mat-spinner>
        <span *ngIf="!loading">{{ 'login.submit' | translate }}</span>
      </button>
    </div>
  </form>
</div>
