<div class="page-header">
  <div>
    <h1>命名空间管理</h1>
    <p class="subtitle">管理 XML 命名空间前缀与 URI 映射</p>
  </div>
  <button mat-raised-button color="primary" (click)="openCreateDialog()">
    <mat-icon>add</mat-icon>
    新建命名空间
  </button>
</div>

<div class="page-content">
  <mat-card>
    <mat-card-content>
      <div class="table-container">
        <table mat-table [dataSource]="namespaces" class="data-table">
          <ng-container matColumnDef="prefix">
            <th mat-header-cell *matHeaderCellDef>前缀</th>
            <td mat-cell *matCellDef="let ns">
              <span class="prefix-badge">{{ ns.prefix }}</span>
            </td>
          </ng-container>

          <ng-container matColumnDef="uri">
            <th mat-header-cell *matHeaderCellDef>URI</th>
            <td mat-cell *matCellDef="let ns">
              <span class="uri-text" [matTooltip]="ns.uri">{{ ns.uri }}</span>
            </td>
          </ng-container>

          <ng-container matColumnDef="workspace">
            <th mat-header-cell *matHeaderCellDef>工作空间</th>
            <td mat-cell *matCellDef="let ns">
              <span *ngIf="ns.workspace; else noWs">{{ ns.workspace }}</span>
              <ng-template #noWs><span class="muted">-</span></ng-template>
            </td>
          </ng-container>

          <ng-container matColumnDef="isolated">
            <th mat-header-cell *matHeaderCellDef>隔离</th>
            <td mat-cell *matCellDef="let ns">
              <mat-slide-toggle
                [checked]="ns.isolated"
                (toggleChange)="toggleIsolated(ns)"
                color="primary"
              >
              </mat-slide-toggle>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>操作</th>
            <td mat-cell *matCellDef="let ns">
              <button
                mat-icon-button
                color="primary"
                (click)="openEditDialog(ns)"
                matTooltip="编辑"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteNamespace(ns)" matTooltip="删除">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">
              <div class="empty-state" *ngIf="!loading">
                <mat-icon>font_download</mat-icon>
                <p>暂无命名空间</p>
                <p class="hint">点击"新建命名空间"按钮创建</p>
              </div>
              <div class="loading-shimmer" *ngIf="loading">
                <mat-spinner diameter="32"></mat-spinner>
              </div>
            </td>
          </tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
